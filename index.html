<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ICISA 2026 — Speaker Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    :root {
      --navy:      #233187;
      --confirmed: #27ae60;
      --pending:   #e67e22;
      --no-task:   #c0392b;
      --heavy:     #8e44ad;
    }
    body { background:#f2f4f8; font-family:'Segoe UI',Arial,sans-serif; font-size:.9rem; }

    /* ── Top bar ── */
    .topbar { background:var(--navy); color:#fff; padding:14px 24px;
      display:flex; align-items:center; justify-content:space-between; }
    .topbar .brand { font-size:1.3rem; font-weight:700; letter-spacing:.5px; }
    .topbar .sub   { font-size:.82rem; opacity:.65; }

    /* ── Stat cards ── */
    .stat-card { background:#fff; border-radius:10px; border-top:5px solid var(--navy);
      text-align:center; padding:16px 12px 12px;
      box-shadow:0 2px 8px rgba(0,0,0,.07); }
    .stat-card .val { font-size:2.2rem; font-weight:700; line-height:1.1; }
    .stat-card .lbl { font-size:.75rem; color:#888; text-transform:uppercase;
      letter-spacing:.5px; margin-top:4px; }

    /* ── Alert panels ── */
    .panel { background:#fff; border-radius:10px;
      box-shadow:0 2px 8px rgba(0,0,0,.07); padding:16px; }
    .panel-title { font-size:.85rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.5px; margin-bottom:10px; }
    .name-list { max-height:230px; overflow-y:auto; }
    .name-item { padding:5px 10px; border-radius:6px; margin-bottom:3px;
      display:flex; justify-content:space-between; align-items:center; font-size:.86rem; }
    .name-item.no-task { background:#fdf3f2; border-left:3px solid var(--no-task); }
    .name-item.heavy   { background:#f9f2fd; border-left:3px solid var(--heavy); }
    .task-badge { font-size:.72rem; font-weight:700; padding:1px 7px;
      border-radius:10px; color:#fff; }
    .empty-note { color:#aaa; font-size:.82rem; font-style:italic; text-align:center;
      padding:20px 0; }

    /* ── Table ── */
    #speaker-table thead th { background:var(--navy); color:#fff;
      font-size:.78rem; font-weight:600; white-space:nowrap; border:none; }
    #speaker-table tbody tr:hover { background:#f5f7ff; }
    #speaker-table td { vertical-align:middle; }

    .badge-Confirmed { background:var(--confirmed); color:#fff; }
    .badge-Pending   { background:var(--pending);   color:#fff; }
    .check { color:var(--confirmed); font-weight:bold; }

    .filter-bar label { font-size:.78rem; font-weight:600; color:#555; margin-bottom:3px; }
    .sort-link { cursor:pointer; user-select:none; }
    .sort-link:hover { text-decoration:underline; }
  </style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="brand">ICISA 2026</div>
    <div class="sub">Speaker Tracker — November 17–19, Tel Aviv</div>
  </div>
  <div id="stamp" style="font-size:.78rem;opacity:.55;text-align:right;"></div>
</div>

<div class="container-fluid px-4 py-4">

  <!-- ── Stat cards ── -->
  <div class="row g-3 mb-4">
    <div class="col-6 col-md-3">
      <div class="stat-card" style="border-top-color:var(--navy)">
        <div class="val" id="kpi-total" style="color:var(--navy)">—</div>
        <div class="lbl">Total Speakers</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card" style="border-top-color:var(--confirmed)">
        <div class="val" id="kpi-confirmed" style="color:var(--confirmed)">—</div>
        <div class="lbl">Confirmed</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card" style="border-top-color:var(--no-task)">
        <div class="val" id="kpi-notask" style="color:var(--no-task)">—</div>
        <div class="lbl">No Sessions Assigned</div>
      </div>
    </div>
    <div class="col-6 col-md-3">
      <div class="stat-card" style="border-top-color:var(--heavy)">
        <div class="val" id="kpi-heavy" style="color:var(--heavy)">—</div>
        <div class="lbl">4+ Sessions</div>
      </div>
    </div>
  </div>

  <!-- ── Alert panels ── -->
  <div class="row g-3 mb-4">
    <div class="col-md-6">
      <div class="panel">
        <div class="panel-title" style="color:var(--no-task)">
          Speakers with no sessions assigned
          <span id="notask-count" style="font-weight:400;color:#aaa;"></span>
        </div>
        <div class="name-list" id="notask-list"></div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="panel">
        <div class="panel-title" style="color:var(--heavy)">
          Speakers with 4 or more sessions
          <span id="heavy-count" style="font-weight:400;color:#aaa;"></span>
        </div>
        <div class="name-list" id="heavy-list"></div>
      </div>
    </div>
  </div>

  <!-- ── Table ── -->
  <div class="panel">
    <div class="row g-2 mb-3 filter-bar align-items-end">
      <div class="col-sm-4 col-md-3">
        <label>Search</label>
        <input id="q" type="text" class="form-control form-control-sm" placeholder="Name or track…" />
      </div>
      <div class="col-sm-4 col-md-2">
        <label>Status</label>
        <select id="f-status" class="form-select form-select-sm">
          <option value="">All</option>
          <option>Confirmed</option>
          <option>Pending</option>
        </select>
      </div>
      <div class="col-sm-4 col-md-3">
        <label>Track</label>
        <select id="f-track" class="form-select form-select-sm">
          <option value="">All Tracks</option>
        </select>
      </div>
      <div class="col-sm-4 col-md-2">
        <label>Tasks</label>
        <select id="f-tasks" class="form-select form-select-sm">
          <option value="">Any</option>
          <option value="0">No sessions (0)</option>
          <option value="4">4+ sessions</option>
        </select>
      </div>
      <div class="col text-end">
        <span id="row-count" class="text-muted" style="font-size:.78rem;"></span>
      </div>
    </div>

    <div class="table-responsive">
      <table class="table table-sm table-hover mb-0" id="speaker-table">
        <thead>
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Track</th>
            <th>Status</th>
            <th class="sort-link" onclick="sortBy('tasks')" title="Click to sort">
              Sessions &#x25BE;</th>
            <th>Bio</th>
            <th>Photo</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script>
const SC = { Confirmed: '#27ae60', Pending: '#e67e22' };
let ALL = [], sortCol = 'tasks', sortDir = -1;

fetch('speakers.json')
  .then(r => r.json())
  .then(data => {
    ALL = data;
    document.getElementById('stamp').textContent =
      `${ALL.length} speakers · last updated ${new Date().toLocaleDateString()}`;
    populateFilters();
    renderPanels(ALL);
    renderKPIs(ALL);
    renderTable(filter());
    ['q','f-status','f-track','f-tasks'].forEach(id =>
      document.getElementById(id).addEventListener('input', refresh));
  });

// ── Filters ────────────────────────────────────────────────────────────────
function populateFilters() {
  const tracks = [...new Set(ALL.map(s => s.track).filter(Boolean))].sort();
  const sel = document.getElementById('f-track');
  tracks.forEach(t => {
    const o = document.createElement('option'); o.value = o.textContent = t;
    sel.appendChild(o);
  });
}

function filter() {
  const q      = document.getElementById('q').value.toLowerCase();
  const status = document.getElementById('f-status').value;
  const track  = document.getElementById('f-track').value;
  const tasks  = document.getElementById('f-tasks').value;

  return ALL.filter(s => {
    if (q && ![s.first, s.last, s.track].join(' ').toLowerCase().includes(q)) return false;
    if (status && s.status !== status) return false;
    if (track  && s.track  !== track)  return false;
    if (tasks === '0' && s.tasks !== 0)  return false;
    if (tasks === '4' && s.tasks < 4)   return false;
    return true;
  });
}

function refresh() { renderTable(filter()); }

// ── KPI cards ──────────────────────────────────────────────────────────────
function renderKPIs(speakers) {
  set('kpi-total',     speakers.length);
  set('kpi-confirmed', speakers.filter(s => s.status === 'Confirmed').length);
  set('kpi-notask',    speakers.filter(s => s.tasks === 0).length);
  set('kpi-heavy',     speakers.filter(s => s.tasks >= 4).length);
}
function set(id, val) { document.getElementById(id).textContent = val; }

// ── Alert panels ───────────────────────────────────────────────────────────
function renderPanels(speakers) {
  const noTask = speakers.filter(s => s.tasks === 0)
    .sort((a,b) => a.last.localeCompare(b.last));
  const heavy  = speakers.filter(s => s.tasks >= 4)
    .sort((a,b) => b.tasks - a.tasks);

  document.getElementById('notask-count').textContent =
    noTask.length ? `(${noTask.length})` : '';
  document.getElementById('heavy-count').textContent =
    heavy.length ? `(${heavy.length})` : '';

  renderNameList('notask-list', noTask, 'no-task', false);
  renderNameList('heavy-list',  heavy,  'heavy',   true);
}

function renderNameList(id, speakers, cls, showCount) {
  const el = document.getElementById(id);
  if (!speakers.length) {
    el.innerHTML = '<div class="empty-note">None currently</div>';
    return;
  }
  el.innerHTML = speakers.map(s => {
    const badge = showCount
      ? `<span class="task-badge" style="background:var(--heavy)">${s.tasks}</span>`
      : `<span class="task-badge" style="background:var(--no-task)">0</span>`;
    const status = s.status === 'Confirmed'
      ? `<span style="color:#27ae60;font-size:.75rem">Confirmed</span>`
      : `<span style="color:#e67e22;font-size:.75rem">Pending</span>`;
    return `<div class="name-item ${cls}">
      <span>${esc(s.first)} <strong>${esc(s.last)}</strong>
        <span class="ms-2">${status}</span></span>
      ${badge}
    </div>`;
  }).join('');
}

// ── Table ──────────────────────────────────────────────────────────────────
function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = -1; }
  renderTable(filter());
}

function renderTable(speakers) {
  const sorted = [...speakers].sort((a,b) => {
    const av = a[sortCol] ?? '', bv = b[sortCol] ?? '';
    if (typeof av === 'number') return sortDir * (av - bv);
    return sortDir * String(av).localeCompare(String(bv));
  });

  document.getElementById('row-count').textContent = sorted.length + ' shown';

  const tbody = document.getElementById('tbody');
  if (!sorted.length) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted py-4">No speakers match the filters.</td></tr>';
    return;
  }

  tbody.innerHTML = sorted.map(s => {
    const bClass = `badge-${s.status}`;
    const tColor = s.tasks === 0 ? 'color:var(--no-task);font-weight:700'
                 : s.tasks >= 4  ? 'color:var(--heavy);font-weight:700'
                 : '';
    return `<tr>
      <td>${esc(s.first)}</td>
      <td><strong>${esc(s.last)}</strong></td>
      <td>${esc(s.track)}</td>
      <td><span class="badge ${bClass} px-2 py-1 rounded-pill">${s.status}</span></td>
      <td style="${tColor}">${s.tasks}</td>
      <td>${s.bio   ? '<span class="check">&#10003;</span>' : ''}</td>
      <td>${s.photo ? '<span class="check">&#10003;</span>' : ''}</td>
    </tr>`;
  }).join('');
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
